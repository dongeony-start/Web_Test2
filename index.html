<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>K-Stock 실시간 차트</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #131722; color: white; padding: 20px; }
        .search-bar { margin-bottom: 20px; text-align: center; }
        input { padding: 10px; width: 250px; border-radius: 4px; border: 1px solid #363c4e; background: #1e222d; color: white; }
        button { padding: 10px 20px; background: #2962ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        /* 차트가 들어갈 공간의 높이를 반드시 지정해야 합니다 */
        #chart_area { height: 100%; width: 100%; margin-top: 10px; border: 1px solid #363c4e; }
    </style>
</head>
<body>

    <div class="search-bar">
        <h2>📈 종목 검색</h2>
        <input type="text" id="targetCode" placeholder="종목코드 6자리 (예: 005930)">
        <button onclick="displayStock()">차트 보기</button>
    </div>

    <div id="chart_area"></div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <script>
        // 차트를 그리는 함수
        function displayStock() {
            let code = document.getElementById('targetCode').value.trim();
            
            // 아무것도 입력 안 했을 때 기본값 (삼성전자)
            if (code === "") code = "005930";

            // 이전 차트를 지우고 새로 그리기 위해 내부를 비움
            document.getElementById('chart_area').innerHTML = '<div id="tv_widget"></div>';

            new TradingView.widget({
                "autosize": true,
                "symbol": "KRX:" + code,
                "interval": "D",
                "timezone": "Asia/Seoul",
                "theme": "dark",
                "style": "1",
                "locale": "ko",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tv_widget" // 이 ID가 위 DIV의 ID와 같아야 함
            });
        }

        // 페이지가 처음 열릴 때 자동으로 삼성전자 차트 보여주기
        window.onload = function() {
            displayStock();
        };
    </script>
</body>
</html>
