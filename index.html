<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner - 여행 계획 도우미</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 800px; margin: 0 auto; }
        .search-section { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
        
        #map { height: 400px; border-radius: 12px; margin-bottom: 20px; z-index: 1; }
        
        .recommendations { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .hotel-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hotel-card h3 { margin-top: 0; color: #333; }
        .price { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌍 어디로 여행을 떠나시나요?</h2>
    <div class="search-section">
        <input type="text" id="cityInput" placeholder="도시 이름을 입력하세요 (예: 서울, 파리)">
        <button onclick="searchTrip()">검색</button>
    </div>

    <div id="map"></div>

    <div id="hotelList" class="recommendations">
        </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 지도 초기화 (기본 위치: 서울)
    let map = L.map('map').setView([37.5665, 126.9780], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let marker;

    // 가상의 숙소 데이터
    const hotelData = {
        "서울": [
            { name: "시그니엘 서울", price: "500,000원~", rating: "5.0" },
            { name: "신라 호텔", price: "400,000원~", rating: "4.8" }
        ],
        "파리": [
            { name: "리츠 파리", price: "1,200,000원~", rating: "4.9" },
            { name: "풀만 파리 투르 에펠", price: "450,000원~", rating: "4.5" }
        ]
    };

    function searchTrip() {
        const city = document.getElementById('cityInput').value;
        const hotelList = document.getElementById('hotelList');
        hotelList.innerHTML = ''; // 초기화

        if (city === "서울") {
            updateMap(37.5665, 126.9780, "서울");
            displayHotels("서울");
        } else if (city === "파리") {
            updateMap(48.8566, 2.3522, "파리");
            displayHotels("파리");
        } else {
            alert("현재는 '서울'과 '파리' 검색만 지원합니다. (데이터 확장 가능)");
        }
    }

    function updateMap(lat, lng, name) {
        map.setView([lat, lng], 13);
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map).bindPopup(name).openPopup();
    }

    function displayHotels(cityName) {
        const hotels = hotelData[cityName];
        const hotelList = document.getElementById('hotelList');
        
        hotels.forEach(hotel => {
            const card = `
                <div class="hotel-card">
                    <h3>${hotel.name}</h3>
                    <p class="price">최저가: ${hotel.price}</p>
                    <p>평점: ⭐ ${hotel.rating}</p>
                </div>
            `;
            hotelList.innerHTML += card;
        });
    }
</script>

</body>
</html>
