<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Stock 실시간 차트 검색기</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; background-color: #131722; color: white; }
        .container { max-width: 1000px; margin: 0 auto; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #363c4e; background: #1e222d; color: white; }
        button { padding: 12px 24px; background: #2962ff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1e4bd8; }
        #chart-container { height: 600px; width: 100%; border-radius: 10px; overflow: hidden; }
        .info-text { margin-top: 10px; font-size: 0.9em; color: #848e9c; }
    </style>
</head>
<body>

<div class="container">
    <h2>📈 한국 주식 실시간 차트</h2>
    <div class="search-box">
        <input type="text" id="stockCode" placeholder="종목 코드를 입력하세요 (예: 005930)">
        <button onclick="updateChart()">차트 보기</button>
    </div>

    <div id="chart-container">
        <div id="tradingview_widget"></div>
    </div>

    <p class="info-text">* 삼성전자: 005930, SK하이닉스: 000660, 현대차: 005380</p>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

<script>
    // 페이지 로드 시 기본적으로 삼성전자 차트 표시
    let currentSymbol = "KRX:005930";

    function loadChart(symbol) {
        new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": "D",
            "timezone": "Asia/Seoul",
            "theme": "dark",
            "style": "1",
            "locale": "ko",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_widget"
        });
    }

    function updateChart() {
        const code = document.getElementById('stockCode').value.trim();
        if (code === "") {
            alert("종목 코드를 입력해 주세요.");
            return;
        }
        
        // 한국 거래소 코드 형식으로 변환 (KRX:005930)
        const formattedSymbol = "KRX:" + code;
        loadChart(formattedSymbol);
    }

    // 초기 실행
    loadChart(currentSymbol);
</script>

</body>
</html>
