<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 여행 플래너</title>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f4f7f6; position: relative; }
        
        #flag-container {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: center;
            display: none; 
        }
        #flag-img {
            width: 100px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #country-name {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
            color: #333;
        }

        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; max-width: 800px; text-align: center; margin-top: 50px; }
        input { padding: 12px; width: 60%; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        
        #map-container { margin-top: 30px; width: 100%; height: 450px; background-color: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="flag-container">
    <img id="flag-img" src="" alt="국기">
    <span id="country-name"></span>
</div>

<div class="container">
    <h1>🌍 여행 계획 플래너</h1>
    <p>가고 싶은 나라나 도시를 입력하세요!</p>
    
    <input type="text" id="destination" placeholder="예: 베트남, Paris, 일본..." onkeypress="if(event.keyCode==13) updatePage()">
    <button onclick="updatePage()">찾기</button>

    <div id="map-container">
        </div>
</div>

<script>
    // 페이지가 로드될 때 실행
    window.onload = function() {
        updatePage('South Korea'); // 기본값으로 한국 설정
    };

    async function updatePage(defaultLocation) {
        const inputVal = document.getElementById('destination').value;
        // 함수 호출 시 인자가 있으면(초기 로드) 그 값을 사용, 없으면 입력창 값 사용
        const destination = defaultLocation || inputVal;
        
        const mapContainer = document.getElementById('map-container');
        const flagContainer = document.getElementById('flag-container');
        const flagImg = document.getElementById('flag-img');
        const countryNameText = document.getElementById('country-name');
        
        if (!destination) {
            alert("내용을 입력해주세요!");
            return;
        }

        // 1. 지도 업데이트
        const mapUrl = `https://www.google.com/maps?q=${encodeURIComponent(destination)}&output=embed`;
        mapContainer.innerHTML = `<iframe src="${mapUrl}" allowfullscreen></iframe>`;

        // 2. 국기 정보 가져오기 (초기 로드 시 한국 국기는 선택사항)
        try {
            const response = await fetch(`https://restcountries.com/v3.1/name/${encodeURIComponent(destination)}`);
            const data = await response.json();

            if (data && data.length > 0) {
                const country = data[0];
                flagImg.src = country.flags.png;
                countryNameText.innerText = country.translations.kor ? country.translations.kor.common : country.name.common;
                flagContainer.style.display = 'block';
            } else {
                flagContainer.style.display = 'none';
            }
        } catch (error) {
            flagContainer.style.display = 'none';
        }
    }
</script>

</body>
</html>
