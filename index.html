<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>K-Stock 멀티 차트 분석기</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; background-color: #131722; color: white; }
        .container { max-width: 1200px; margin: 0 auto; }
        .search-area { display: flex; gap: 15px; margin-bottom: 20px; background: #1e222d; padding: 20px; border-radius: 10px; }
        .input-group { flex: 1; }
        label { display: block; margin-bottom: 8px; font-size: 0.9em; color: #848e9c; }
        input { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #363c4e; background: #2a2e39; color: white; box-sizing: border-box; }
        
        /* 듀얼 차트 레이아웃 */
        .chart-wrapper { display: flex; gap: 15px; height: 600px; }
        .chart-box { flex: 1; background: #1e222d; border-radius: 10px; overflow: hidden; position: relative; }
        .chart-title { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 K-Stock 멀티 분석 대시보드</h2>
    
    <div class="search-area">
        <div class="input-group">
            <label>차트 1 (이름 또는 코드)</label>
            <input type="text" id="input1" placeholder="예: 삼성전자 또는 005930" onchange="updateCharts()">
        </div>
        <div class="input-group">
            <label>차트 2 (비교 종목)</label>
            <input type="text" id="input2" placeholder="예: SK하이닉스 또는 000660" onchange="updateCharts()">
        </div>
    </div>

    <div class="chart-wrapper">
        <div class="chart-box">
            <div id="tv_chart_1" style="height: 100%;"></div>
        </div>
        <div class="chart-box">
            <div id="tv_chart_2" style="height: 100%;"></div>
        </div>
    </div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
