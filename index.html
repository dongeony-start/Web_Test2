<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Global Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 350px; padding: 20px; border-right: 1px solid #ddd; overflow-y: auto; }
        .main-content { flex: 1; padding: 20px; overflow-y: auto; }
        #map { height: 400px; width: 100%; border-radius: 10px; margin: 10px 0; }
        .hotel-card { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        #cityInput { width: 100%; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>📅 여행 날짜 선택</h3>
        <div id="calendar"></div>
    </div>

    <div class="main-content">
        <input type="text" id="cityInput" placeholder="도시를 검색하세요">
        <div id="map"></div>
        <div style="display:flex; justify-content: space-between;">
            <h3>🏠 숙소 목록 <span id="selectedDateText"></span></h3>
            <select id="sortOption" onchange="handleSort()">
                <option value="rating">평점순</option>
                <option value="priceAsc">가격 낮은순</option>
            </select>
        </div>
        <div id="hotelList"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD55siqdEZZXoowLK9t8hq5KYl1MpnKPgQ&libraries=places"></script>

    <script>
        let map, service, currentHotels = [];

        // 페이지가 열리면 실행
        window.onload = function() {
            // 지도 초기화
            const seoul = { lat: 37.5665, lng: 126.9780 };
            map = new google.maps.Map(document.getElementById('map'), { zoom: 12, center: seoul });
            service = new google.maps.places.PlacesService(map);

            // 자동완성 설정
            const input = document.getElementById('cityInput');
            const autocomplete = new google.maps.places.Autocomplete(input, { types: ['(cities)'] });
            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();
                if (place.geometry) {
                    map.setCenter(place.geometry.location);
                    searchHotels(place.geometry.location);
                }
            });

            // 달력 초기화
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                dateClick: (info) => {
                    document.getElementById('selectedDateText').innerText = ` - ${info.dateStr}`;
                    searchHotels(map.getCenter()); // 날짜 선택 시 현재 지도 중심 기준으로 검색
                }
            });
            calendar.render();
        };

        function searchHotels(location) {
            const request = { location: location, radius: '3000', type: ['lodging'] };
            service.nearbySearch(request, (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK) {
                    currentHotels = results.map(p => ({
                        name: p.name,
                        rating: p.rating || 0,
                        price: Math.floor(Math.random() * 200000) + 50000,
                        address: p.vicinity
                    }));
                    handleSort();
                }
            });
        }

        function handleSort() {
            const option = document.getElementById('sortOption').value;
            if (option === "rating") currentHotels.sort((a, b) => b.rating - a.rating);
            else currentHotels.sort((a, b) => a.price - b.price);
            render();
        }

        function render() {
            const list = document.getElementById('hotelList');
            list.innerHTML = currentHotels.map(h => `
                <div class="hotel-card">
                    <h4>${h.name}</h4>
                    <p>⭐ ${h.rating} | 💰 ${h.price.toLocaleString()}원</p>
                    <p style="font-size:12px; color:gray;">${h.address}</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
