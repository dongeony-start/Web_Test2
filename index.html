<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 여행 플래너</title>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f4f7f6; position: relative; min-height: 100vh; margin: 0; }
        
        /* 국기 표시 영역 */
        #flag-container {
            position: fixed;
            top: 20px;
            right: 20px;
            text-align: center;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 10px;
            display: none;
        }
        #flag-img {
            width: 80px;
            display: block;
            border: 1px solid #ccc;
            margin-bottom: 5px;
        }
        #country-name { font-size: 12px; font-weight: bold; color: #333; }

        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 800px; text-align: center; margin-top: 60px; }
        .input-group { margin-bottom: 20px; }
        input { padding: 12px; width: 60%; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        
        #map-container { width: 100%; height: 500px; background-color: #eee; border-radius: 8px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="flag-container">
    <img id="flag-img" src="" alt="National Flag">
    <div id="country-name"></div>
</div>

<div class="container">
    <h1>✈️ 여행지 검색</h1>
    <div class="input-group">
        <input type="text" id="destination" placeholder="나라나 도시를 입력하세요 (예: 베트남, 런던)" onkeypress="if(event.keyCode==13) updatePage()">
        <button onclick="updatePage()">검색</button>
    </div>

    <div id="map-container">
        </div>
</div>

<script>
    // 초기 로드 시 한국 지도 표시
    window.onload = () => {
        updatePage('South Korea');
    };

    async function updatePage(initialValue) {
        const input = document.getElementById('destination');
        const query = initialValue || input.value;
        
        if (!query) {
            alert("검색어를 입력해 주세요!");
            return;
        }

        // 1. 지도 업데이트
        const mapContainer = document.getElementById('map-container');
        const mapUrl = `https://www.google.com/maps?q=${encodeURIComponent(query)}&output=embed`;
        mapContainer.innerHTML = `<iframe src="${mapUrl}"></iframe>`;

        // 2. 국기 정보 가져오기
        await fetchFlag(query);
    }

    async function fetchFlag(query) {
        const flagContainer = document.getElementById('flag-container');
        const flagImg = document.getElementById('flag-img');
        const countryText = document.getElementById('country-name');

        try {
            // API 호출 (국가 이름으로 검색)
            const response = await fetch(`https://restcountries.com/v3.1/name/${encodeURIComponent(query)}`);
            
            if (!response.ok) throw new Error('Country not found');

            const data = await response.json();
            const country = data[0];

            flagImg.src = country.flags.png;
            countryText.innerText = country.translations.kor ? country.translations.kor.common : country.name.common;
            flagContainer.style.display = 'block';
        } catch (error) {
            console.log("국기 정보를 찾을 수 없습니다. 도시 이름일 경우 국가 검색이 필요합니다.");
            flagContainer.style.display = 'none';
        }
    }
</script>

</body>
</html>
