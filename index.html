<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 여행 플래너</title>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; max-width: 800px; text-align: center; }
        input { padding: 12px; width: 60%; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        #map-container { margin-top: 30px; width: 100%; height: 450px; background-color: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌍 여행 계획 플래너</h1>
    <p>가고 싶은 여행지를 입력해 보세요!</p>
    
    <input type="text" id="destination" placeholder="예: 베트남, 도쿄, 파리..." onkeypress="if(event.keyCode==13) updateMap()">
    <button onclick="updateMap()">지도 보기</button>

    <div id="map-container">
        <p id="placeholder-text">여행지를 입력하면 지도가 여기에 나타납니다. </p>
    </div>
</div>

<script>
    function updateMap() {
        const destination = document.getElementById('destination').value;
        const mapContainer = document.getElementById('map-container');
        
        if (!destination) {
            alert("여행지를 입력해주세요!");
            return;
        }

        // 구글 맵 임베드 URL 생성
        const mapUrl = `https://www.google.com/maps?q=${encodeURIComponent(destination)}&output=embed`;
        
        // 지도 업데이트
        mapContainer.innerHTML = `<iframe src="${mapUrl}" allowfullscreen></iframe>`;
    } 
</script>

</body>
</html>
